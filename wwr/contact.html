<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description"
      content="Contact White Water Rafting for reservations, questions, and trip information.">
    <meta name="author" content="Thomas Daniel Okila">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>

        <img src="images/z-wwr-blue.jpg" alt="White Water Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>

    </header>

    <main>

        <section class="company-info">

            <h1>White Water Rafting Company</h1>

            <p>123 River Adventure Road</p>
            <p>Idaho Falls, Idaho 83401</p>
            <p>+1 (208) 555-1234</p>
            <p>info@whitewaterrafting.com</p>

        </section>

        <section class="contact-grid">

            <div class="map">

                <iframe src="https://www.google.com/maps?q=Idaho+Falls,+Idaho&output=embed"
                  loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade">
                </iframe>

            </div>

            <div class="contact-form">

                <form action="#" method="post">

                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your Email" required>

                    <fieldset>

                        <legend>Message Purpose</legend>

                        <input type="radio" id="general" name="purpose" value="general" required>

                        <label for="general">General Inquiry</label>

                        <br>

                        <input type="radio" id="reservation" name="purpose" value="reservation">

                        <label for="reservation">Reservation Question</label>

                        <br>

                        <input type="radio" id="website" name="purpose" value="website">

                        <label for="website">Website Suggestion</label>

                    </fieldset>

                    <label for="message">Message</label>

                    <textarea id="message" name="message" rows="6"
                      placeholder="Type your message here..." required></textarea>

                    <input type="checkbox" id="newsletter" name="newsletter">

                    <label for="newsletter">
                        Please subscribe me to the monthly newsletter.
                    </label>

                    <button type="submit">
                        Get in Touch!
                    </button>

                </form>

            </div>

        </section>

        <section class="employees">

            <h2>We Are Here to Serve You.</h2>

            <div class="employee-cards">

                <figure>
                    <img src="images/profile.jpg" alt="Operations Manager">
                    <figcaption>Sarah Johnson<br>Operations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/profile.jpg" alt="Lead River Guide">
                    <figcaption>David Smith<br>Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/profile.jpg" alt="Customer Service Representative">
                    <figcaption>Emily Brown<br>Customer Service Representative</figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 White Water Rafting | Thomas Daniel Okila</p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook_logo_icon_147291.webp" alt="Facebook">
            </a>

            <a href="https://instagram.com">
                <img src="images/3721672-instagram_108066.webp" alt="Instagram">
            </a>

            <a href="https://x.com">
                <img src="images/twitter_x.webp" alt="X">
            </a>

        </nav>

    </footer>

</body>

</html>
